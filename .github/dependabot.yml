# Dependabot: PRs semanales (lunes) para las actions (fijadas por SHA), las dependencias npm
# (pnpm-lock.yaml) y la imagen base del Dockerfile (fijada por digest).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Saltos mayores del framework (Nuxt 4, Vite 7/8, Pinia 3): migración a mano (backlog J).
      - dependency-name: nuxt
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: pinia
        update-types: ['version-update:semver-major']
      - dependency-name: '@pinia/nuxt'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node mayor (22 -> 24/26): junto con la migración de Nuxt, a mano. Solo parches y digests.
      - dependency-name: node
        update-types: ['version-update:semver-major']
