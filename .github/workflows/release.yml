name: Release

# Tag vX.Y.Z (creado por `bash release.sh X.Y.Z` y empujado con `git push origin master --tags`):
# GitHub Release con la sección de esa versión del CHANGELOG.md como notas. La consola no
# publica imagen: el despliegue lo hace Cloudflare desde master; el tag marca qué versión es.
#
# Actions fijadas por SHA de commit (el tag es un comentario); Dependabot las actualiza.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validar el tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag no semver: $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Notas desde CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md no tiene la sección [${GITHUB_REF_NAME#v}]"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
